<div nz-row>
    <div nz-col nzSpan="24">
        <div class="box">
            <nz-divider nzText="Yearly Income"></nz-divider>
            <div nz-row class="content-box">

                <nz-form-item nz-col nzSpan="12">

                    <nz-form-control>
                        <nz-form-label nzRequired [nzNoColon]="true">Annual Income (in lakhs)</nz-form-label>
                        <nz-select [(ngModel)]="financialInfo.INCOME">
                            <nz-option [nzValue]="'A'" nzLabel="Below Rs 50,000"></nz-option>
                            <nz-option [nzValue]="'B'" nzLabel="Rs. 50,001 - Rs. 2 Lakh"></nz-option>
                            <nz-option [nzValue]="'C'" nzLabel="Rs. 2.01 Lakh - Rs. 5 Lakh"></nz-option>
                            <nz-option [nzValue]="'D'" nzLabel="Rs. 5.01 Lakh - Rs. 10 Lakh"></nz-option>
                            <nz-option [nzValue]="'E'" nzLabel="Rs. 10.01 Lakh - Rs. 15 Lakh"></nz-option>
                            <nz-option [nzValue]="'F'" nzLabel="Rs. 15.01 Lakh - Rs. 25 Lakh"></nz-option>
                            <nz-option [nzValue]="'G'" nzLabel="Above Rs. 25 Lakh"></nz-option>
                        </nz-select>

                    </nz-form-control>
                </nz-form-item>

            </div>
        </div>
    </div>
</div>
